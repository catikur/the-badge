name: platform-esitligi
# DECISIONS P0 — platformlar arasi determinizm (bulgu 2026-09-06, karar 2026-10-04).
# CLAUDE.md degismez #2 "ayni girdi + ayni seed = HER PLATFORMDA bit-ayni" der; sim-ci yalniz
# ubuntu'da kostugu icin bu iddia OLCULMUYORDU. Bu is ayni Checks'i macOS arm64'te kosar.
# Bilinen sapmalar shared/TheBadge.Sim.Checks/goldens/platform_debt.json'da korumali borctur:
# yeni sapma da, sessizce duzelen sapma da kapiyi kirar. Hedef bos liste — P0 (a) motor dilimi.
#
# Not: bu is .NET'i macOS arm64'te olcer. Gercek istemci Unity IL2CPP / iOS arm64'tur — farkli bir
# calisma zamani ve libm. Bu is o platformun VEKILIDIR, kendisi degil; iddiasi bundan genis degil.
on:
  pull_request:
    paths:
      - 'shared/**'
      - 'balance/**'
      - '.github/workflows/ci-platform.yml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'balance/**'
      - '.github/workflows/ci-platform.yml'
  workflow_dispatch: {}
jobs:
  determinizm-osx-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Mimari dogrulamasi (borc tablosu arm64 icin olculdu)
        run: |
          echo "makine: $(uname -m) · $(sw_vers -productVersion) · dotnet $(dotnet --version)"
          test "$(uname -m)" = "arm64"
      - name: Determinizm kapisi (macOS arm64)
        run: dotnet run --project shared/TheBadge.Sim.Checks -c Release
